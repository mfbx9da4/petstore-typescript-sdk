workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    petstore:
        inputs:
            - location: ./openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/speakeasy-self/speakeasy-self/petstore
targets:
    typescript:
        target: typescript
        source: petstore
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/speakeasy-self/speakeasy-self/petstore-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
